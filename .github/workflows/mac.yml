name: macOS app

on:
  push:
    branches: [main]
    paths: ["mac/**", "web/**", "VERSION", ".github/workflows/mac.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build CopyCat.app
        run: bash mac/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: CopyCat-mac
          path: mac/dist/CopyCat-mac.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mac/dist/CopyCat-mac.zip --clobber
